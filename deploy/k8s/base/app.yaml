apiVersion: apps/v1
kind: Deployment
metadata:
  name: private-ai-lab-api
  namespace: private-ai-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: private-ai-lab-api
  template:
    metadata:
      labels:
        app: private-ai-lab-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: private-ai-lab:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: private-ai-lab-config
            - secretRef:
                name: private-ai-lab-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
            - name: uploads
              mountPath: /data/uploads
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: temporary-files
          emptyDir: {}
        - name: uploads
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: private-ai-lab-api
  namespace: private-ai-lab
spec:
  selector:
    app: private-ai-lab-api
  ports:
    - name: http
      port: 80
      targetPort: 8000
